<!-- 
  デグー環境モニタリングダッシュボード + 状態判定機能（差分表示版）+ 状態占有時間円グラフ
  作成日: 2025-01-18
  説明: Ambient APIからデータを取得してグラフ表示 + 5分間の増加量を数値表示 + 状態別占有時間の円グラフ
  修正: 状態占有時間の計算精度を向上（実測値ベースの時間配分）
-->
<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デグー環境モニタリングダッシュボード</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function DeguMonitoringDashboard() {
      const [data, setData] = useState([]);
      const [latestData, setLatestData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [lastUpdate, setLastUpdate] = useState(null);
      const [dataRange, setDataRange] = useState(100);
      const [error, setError] = useState(null);
      const [updateKey, setUpdateKey] = useState(0);

      // 健康記録関連のstate
      const [healthRecords, setHealthRecords] = useState([]);
      const [recordDate, setRecordDate] = useState(new Date().toISOString().split('T')[0]);
      const [weight, setWeight] = useState('');
      const [fecesCondition, setFecesCondition] = useState('');
      const [memo, setMemo] = useState('');

      const CHANNEL_ID = '77767';
      const READ_KEY = '73ff0a03269c1f35';
      const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbygafxILyUYiajSYjThZeIezQS5SLzodxgjkfnmRFcqBEUo_iRS4MCeSUmlHsvl8XinVw/exec';

      // デグーの状態を判定する関数（5分間の差分で判定）
      const judgeDeguState = (currentData, previousData) => {
        if (!previousData) {
          return {
            states: [{
              label: '⏳ データ収集中',
              color: 'bg-gray-300 text-gray-700',
              value: '（前回データ待ち）',
              priority: 999
            }],
            diffs: null,
            primaryState: 'データ収集中',
            timeAllocation: null
          };
        }

        const states = [];

        // 5分間の各センサーの差分を計算
        // 注意: 日の変わり目で累積値がリセットされる場合、差分がマイナスになる
        let rotDiff = (currentData.d1 || 0) - (previousData.d1 || 0);
        let sitDiff = (currentData.d8 || 0) - (previousData.d8 || 0);
        let drkDiff = (currentData.d6 || 0) - (previousData.d6 || 0);
        let motDiff = (currentData.d7 || 0) - (previousData.d7 || 0);
        
        // 日の変わり目でリセットされた場合（差分がマイナス）は0とする
        // この期間のデータは信頼できないため、活動なしとして扱う
        if (rotDiff < 0) rotDiff = 0;
        if (sitDiff < 0) sitDiff = 0;
        if (drkDiff < 0) drkDiff = 0;
        if (motDiff < 0) motDiff = 0;

        // 差分データを保存
        const diffs = {
          rot: rotDiff,
          sit: sitDiff,
          drk: drkDiff,
          mot: motDiff
        };

        // 時間配分の計算（5分 = 300秒 を100として計算）
        const timeAllocation = {
          running: 0,   // 走行
          eating: 0,    // 食事
          drinking: 0,  // 飲水
          active: 0,    // 活動
          resting: 0    // 休息
        };

        const INTERVAL_MINUTES = 5;
        const DRINKING_WEIGHT = 0.4; // 飲水のウエイト

        // 食事時間の計算（sitDiffが実測値、100 = 5分）
        if (sitDiff > 0) {
          timeAllocation.eating = (sitDiff / 100) * INTERVAL_MINUTES;
        }

        // 活動時間の計算（motDiffが実測値、100 = 5分）
        let rawActiveTime = 0;
        if (motDiff > 0) {
          rawActiveTime = (motDiff / 100) * INTERVAL_MINUTES;
        }

        // 飲水時間の計算
        if (drkDiff > 0) {
          timeAllocation.drinking = INTERVAL_MINUTES * DRINKING_WEIGHT;
        }

        // 走行時間の計算
        if (rotDiff > 0) {
          // 走行している場合
          let remainingTime = INTERVAL_MINUTES - timeAllocation.eating - timeAllocation.drinking;
          timeAllocation.running = Math.max(0, remainingTime);
          
          // 活動時間は無視（走行に含まれる）
          timeAllocation.active = 0;
        } else {
          // 走行していない場合
          if (drkDiff > 0) {
            // 飲水している場合
            if (timeAllocation.eating > 0) {
              // 食事もしている場合：食事を正として、残りを飲水とする
              let remainingTime = INTERVAL_MINUTES - timeAllocation.eating;
              timeAllocation.drinking = Math.min(timeAllocation.drinking, remainingTime);
              
              // さらに残った時間を活動に配分
              remainingTime = INTERVAL_MINUTES - timeAllocation.eating - timeAllocation.drinking;
              timeAllocation.active = Math.min(rawActiveTime, remainingTime);
            } else {
              // 食事していない場合：飲水を正として、残りを活動に配分
              let remainingTime = INTERVAL_MINUTES - timeAllocation.drinking;
              timeAllocation.active = Math.min(rawActiveTime, remainingTime);
            }
          } else {
            // 飲水していない場合：食事と活動を配分
            let remainingTime = INTERVAL_MINUTES - timeAllocation.eating;
            timeAllocation.active = Math.min(rawActiveTime, remainingTime);
          }
        }

        // 休息時間の計算（残り時間）
        const usedTime = timeAllocation.running + timeAllocation.eating + 
                        timeAllocation.drinking + timeAllocation.active;
        timeAllocation.resting = Math.max(0, INTERVAL_MINUTES - usedTime);

        // 状態の表示（優先度順）
        if (rotDiff > 0) {
          states.push({
            label: '🏃 走行中',
            color: 'bg-purple-500 text-white',
            value: `+${rotDiff.toFixed(1)}m/5分`,
            priority: 1,
            stateKey: '走行中'
          });
        }

        if (sitDiff > 0) {
          states.push({
            label: '🍽️ 食事中',
            color: 'bg-orange-500 text-white',
            value: `+${sitDiff.toFixed(1)}/5分`,
            priority: 2,
            stateKey: '食事中'
          });
        }

        if (drkDiff > 0) {
          states.push({
            label: '💧 飲水中',
            color: 'bg-cyan-500 text-white',
            value: `+${drkDiff.toFixed(1)}ml/5分`,
            priority: 3,
            stateKey: '飲水中'
          });
        }

        if (motDiff > 0 && rotDiff === 0) {
          states.push({
            label: '🐹 活動中',
            color: 'bg-green-500 text-white',
            value: `+${motDiff.toFixed(1)}/5分`,
            priority: 4,
            stateKey: '活動中'
          });
        }

        if (states.length === 0) {
          states.push({
            label: '😴 休息中',
            color: 'bg-gray-500 text-white',
            value: '（活動なし）',
            priority: 5,
            stateKey: '休息中'
          });
        }

        // 優先度が最も高い状態を選択（数値が小さいほど優先度が高い）
        const primaryState = states.reduce((prev, current) => 
          prev.priority < current.priority ? prev : current
        ).stateKey;

        return { states, diffs, primaryState, timeAllocation };
      };

      // 状態占有時間を計算する関数（改良版：実測値ベース）
      const calculateStateOccupancy = (dataArray) => {
        const stateTimes = {
          '走行中': 0,
          '食事中': 0,
          '飲水中': 0,
          '活動中': 0,
          '休息中': 0
        };

        // 各データポイントで状態を判定して時間を加算
        dataArray.forEach((current, index) => {
          if (index === 0) return; // 最初のデータはスキップ（前データがない）
          
          const previous = dataArray[index - 1];
          const judgment = judgeDeguState(current, previous);
          
          if (judgment.timeAllocation) {
            stateTimes['走行中'] += judgment.timeAllocation.running;
            stateTimes['食事中'] += judgment.timeAllocation.eating;
            stateTimes['飲水中'] += judgment.timeAllocation.drinking;
            stateTimes['活動中'] += judgment.timeAllocation.active;
            stateTimes['休息中'] += judgment.timeAllocation.resting;
          }
        });

        return stateTimes;
      };

      const fetchData = async () => {
        try {
          setError(null);

          const timestamp = Date.now();
          const random = Math.random().toString(36).substring(7);
          const apiUrl = `https://ambidata.io/api/v2/channels/${CHANNEL_ID}/data?readKey=${READ_KEY}&n=${dataRange}&_t=${timestamp}&_r=${random}`;

          console.log('🔄 データ取得開始:', new Date().toLocaleTimeString());

          const response = await fetch(apiUrl, {
            method: 'GET',
            mode: 'cors',
            cache: 'no-store',
            headers: {
              'Accept': 'application/json'
            }
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }

          const result = await response.json();

          if (result && result.length > 0) {
            const sortedData = result.reverse();

            const formattedData = sortedData.map(item => ({
              ...item,
              time: new Date(item.created).toLocaleString('ja-JP', {
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
              }),
              timeOnly: new Date(item.created).toLocaleString('ja-JP', {
                hour: '2-digit',
                minute: '2-digit'
              }),
              fullTime: new Date(item.created).toLocaleString('ja-JP')
            }));

            setData([...formattedData]);
            setLatestData({ ...formattedData[formattedData.length - 1] });
            setLastUpdate(new Date());
            setUpdateKey(prev => prev + 1);
            console.log('✅ データ取得完了:', formattedData.length, '件');
            console.log('📊 最新:', formattedData[formattedData.length - 1].fullTime);
          }
          setLoading(false);
        } catch (error) {
          console.error('❌ エラー:', error.message);
          setError(error.message);
          setLoading(false);
        }
      };

      // 健康記録を取得
      const fetchHealthRecords = async () => {
        try {
          const response = await fetch(GOOGLE_SCRIPT_URL);
          const records = await response.json();
          setHealthRecords(records);
          console.log('✅ 健康記録取得:', records.length, '件');
        } catch (error) {
          console.error('❌ 健康記録取得エラー:', error);
        }
      };

      // 健康記録を保存
      const saveHealthRecord = async () => {
        if (!weight) {
          alert('体重を入力してください');
          return;
        }

        try {
          const response = await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              date: recordDate,
              weight: parseFloat(weight),
              fecesCondition: fecesCondition,
              memo: memo
            })
          });

          alert('✅ 記録を保存しました！');
          setWeight('');
          setFecesCondition('');
          setMemo('');

          // 再読み込み
          setTimeout(() => fetchHealthRecords(), 1000);
        } catch (error) {
          console.error('❌ 保存エラー:', error);
          alert('保存しました（no-corsモードのため確認不可）');
          setTimeout(() => fetchHealthRecords(), 1000);
        }
      };

      useEffect(() => {
        fetchData();
        fetchHealthRecords();
        console.log('⏰ 自動更新: 3分毎');
        const interval = setInterval(() => {
          console.log('🔄 自動更新実行');
          fetchData();
          fetchHealthRecords();
        }, 3 * 60 * 1000);

        return () => clearInterval(interval);
      }, [dataRange]);

      if (loading) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100">
            <div className="text-center">
              <div className="text-2xl font-bold text-indigo-600 mb-4">データ読み込み中...</div>
              <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto"></div>
            </div>
          </div>
        );
      }

      if (error) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100">
            <div className="bg-white rounded-lg shadow-lg p-8 max-w-md">
              <div className="text-red-600 text-xl font-bold mb-4">⚠️ エラー</div>
              <div className="text-gray-700 mb-4">{error}</div>
              <div className="text-sm text-gray-500 mb-4">
                ブラウザがAmbient APIへの直接アクセスをブロックしている可能性があります。
              </div>
              <button
                onClick={() => {
                  setLoading(true);
                  setError(null);
                  fetchData();
                }}
                className="w-full px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700"
              >
                再試行
              </button>
            </div>
          </div>
        );
      }

      // 最新データとその1つ前のデータを取得
      const previousData = data.length >= 2 ? data[data.length - 2] : null;
      const judgmentResult = latestData ? judgeDeguState(latestData, previousData) : { states: [], diffs: null };
      const deguStates = judgmentResult.states;
      const sensorDiffs = judgmentResult.diffs;

      // 状態占有時間を計算
      const stateOccupancy = data.length > 0 ? calculateStateOccupancy(data) : null;

      return (
        <div key={updateKey} className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
          <div className="max-w-7xl mx-auto">
            {/* ヘッダー */}
            <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                  <h1 className="text-3xl font-bold text-gray-800 mb-2">
                    🐹 デグー環境モニタリング
                  </h1>
                  <p className="text-gray-600">チャンネル: DeguMoni_Integrated (ID: {CHANNEL_ID})</p>
                </div>
                <div className="text-right">
                  <div className="text-sm text-gray-500 mb-2">
                    最終更新: {lastUpdate?.toLocaleString('ja-JP')}
                  </div>
                  <div className="text-xs text-gray-400 mb-2">
                    次回更新: 3分後（自動）
                  </div>
                  <div className="flex gap-2">
                    <select
                      value={dataRange}
                      onChange={(e) => setDataRange(Number(e.target.value))}
                      className="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                      <option value={50}>50件</option>
                      <option value={100}>100件</option>
                      <option value={300}>300件</option>
                      <option value={600}>600件</option>
                    </select>
                    <button
                      onClick={() => {
                        console.log('🔘 手動更新');
                        fetchData();
                        fetchHealthRecords();
                      }}
                      className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors"
                    >
                      🔄 今すぐ更新
                    </button>
                  </div>
                </div>
              </div>
            </div>

            {/* デグーの状態表示セクション + 状態占有時間の円グラフ */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
              {/* デグーの現在の状態 */}
              <div className="bg-white rounded-lg shadow-lg p-6">
                <h2 className="text-xl font-bold mb-4 text-gray-800">🐹 デグーの現在の状態（過去5分間の活動）</h2>
                <div className="flex flex-wrap gap-3 mb-3">
                  {deguStates.map((state, idx) => (
                    <span key={idx} className={`px-4 py-2 rounded-full ${state.color} font-semibold text-lg`}>
                      {state.label} {state.value}
                    </span>
                  ))}
                </div>
                <div className="text-sm text-gray-500 mb-4">
                  判定期間: {previousData?.fullTime || '--'} → {latestData?.fullTime || '--'}
                </div>

                {/* 過去5分間の変化を表示 */}
                {sensorDiffs && (
                  <div className="mt-4 p-4 bg-gray-50 rounded-lg">
                    <p className="font-semibold mb-3 text-gray-800">過去5分間の変化:</p>
                    <div className="grid grid-cols-2 gap-3">
                      <div className="flex items-center gap-2">
                        <span className="text-xl">🏃</span>
                        <div>
                          <div className="text-xs text-gray-500">走行距離</div>
                          <div className={`font-semibold ${sensorDiffs.rot > 0 ? 'text-purple-600' : 'text-gray-400'}`}>
                            +{sensorDiffs.rot.toFixed(1)}m
                          </div>
                        </div>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="text-xl">🍽️</span>
                        <div>
                          <div className="text-xs text-gray-500">食事</div>
                          <div className={`font-semibold ${sensorDiffs.sit > 0 ? 'text-orange-600' : 'text-gray-400'}`}>
                            +{sensorDiffs.sit.toFixed(1)}
                          </div>
                        </div>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="text-xl">💧</span>
                        <div>
                          <div className="text-xs text-gray-500">飲水</div>
                          <div className={`font-semibold ${sensorDiffs.drk > 0 ? 'text-cyan-600' : 'text-gray-400'}`}>
                            +{sensorDiffs.drk.toFixed(1)}ml
                          </div>
                        </div>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="text-xl">🐹</span>
                        <div>
                          <div className="text-xs text-gray-500">動体</div>
                          <div className={`font-semibold ${sensorDiffs.mot > 0 ? 'text-green-600' : 'text-gray-400'}`}>
                            +{sensorDiffs.mot.toFixed(1)}
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>

              {/* 状態占有時間の円グラフ */}
              {stateOccupancy && (
                <div className="bg-white rounded-lg shadow-lg p-6">
                  <h2 className="text-xl font-bold mb-4 text-gray-800">🥧 状態別占有時間（集計期間：{data.length}件 ≈ {Math.round((data.length - 1) * 5 / 60)}時間）</h2>
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div>
                      <StateOccupancyPieChart stateOccupancy={stateOccupancy} />
                    </div>
                    <div className="flex flex-col justify-center space-y-3">
                      <h3 className="font-bold text-gray-800 mb-2">詳細データ:</h3>
                      <StateOccupancyDetail label="🏃 走行中" minutes={stateOccupancy['走行中']} color="text-purple-600" totalMinutes={Object.values(stateOccupancy).reduce((a, b) => a + b, 0)} />
                      <StateOccupancyDetail label="🍽️ 食事中" minutes={stateOccupancy['食事中']} color="text-orange-600" totalMinutes={Object.values(stateOccupancy).reduce((a, b) => a + b, 0)} />
                      <StateOccupancyDetail label="💧 飲水中" minutes={stateOccupancy['飲水中']} color="text-cyan-600" totalMinutes={Object.values(stateOccupancy).reduce((a, b) => a + b, 0)} />
                      <StateOccupancyDetail label="🐹 活動中" minutes={stateOccupancy['活動中']} color="text-green-600" totalMinutes={Object.values(stateOccupancy).reduce((a, b) => a + b, 0)} />
                      <StateOccupancyDetail label="😴 休息中" minutes={stateOccupancy['休息中']} color="text-gray-600" totalMinutes={Object.values(stateOccupancy).reduce((a, b) => a + b, 0)} />
                    </div>
                  </div>
                </div>
              )}
            </div>

            {/* 最新値表示 - 6つのボックス */}
            {latestData && (
              <div className="grid grid-cols-2 md:grid-cols-6 gap-4 mb-6">
                <div className="bg-white rounded-lg shadow p-4">
                  <div className="text-sm text-gray-500 mb-1">温度</div>
                  <div className="text-3xl font-bold text-orange-600">{latestData.d3}°C</div>
                  <div className="text-xs text-gray-400 mt-1">THU-TEMP</div>
                </div>
                <div className="bg-white rounded-lg shadow p-4">
                  <div className="text-sm text-gray-500 mb-1">湿度</div>
                  <div className="text-3xl font-bold text-blue-600">{latestData.d4}%</div>
                  <div className="text-xs text-gray-400 mt-1">THU-HUM</div>
                </div>
                <div className="bg-white rounded-lg shadow p-4">
                  <div className="text-sm text-gray-500 mb-1">走行距離</div>
                  <div className="text-3xl font-bold text-red-600">{latestData.d1}</div>
                  <div className="text-xs text-gray-400 mt-1">ROT-ACUM</div>
                </div>
                <div className="bg-white rounded-lg shadow p-4">
                  <div className="text-sm text-gray-500 mb-1">飲水累積</div>
                  <div className="text-3xl font-bold text-cyan-600">{latestData.d6}</div>
                  <div className="text-xs text-gray-400 mt-1">DRK-ACUM</div>
                </div>
                <div className="bg-white rounded-lg shadow p-4">
                  <div className="text-sm text-gray-500 mb-1">MOT</div>
                  <div className="text-3xl font-bold text-purple-600">{latestData.d7}</div>
                  <div className="text-xs text-gray-400 mt-1">MOT-ACUM</div>
                </div>
                <div className="bg-white rounded-lg shadow p-4">
                  <div className="text-sm text-gray-500 mb-1">SIT</div>
                  <div className="text-3xl font-bold text-green-600">{latestData.d8}</div>
                  <div className="text-xs text-gray-400 mt-1">KUSA-ACUM</div>
                </div>
              </div>
            )}

            {/* データサマリー */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
              <div className="bg-white rounded-lg shadow-lg p-6">
                <h2 className="text-xl font-bold mb-4 text-gray-800">🌡️ 温湿度推移</h2>
                <div className="space-y-3">
                  <DataRow label="現在の温度" value={`${latestData?.d3}°C`} trend={calculateTrend(data, 'd3')} />
                  <DataRow label="現在の湿度" value={`${latestData?.d4}%`} trend={calculateTrend(data, 'd4')} />
                  <DataRow label="平均温度" value={`${calculateAverage(data, 'd3')}°C`} />
                  <DataRow label="平均湿度" value={`${calculateAverage(data, 'd4')}%`} />
                </div>
              </div>

              <div className="bg-white rounded-lg shadow-lg p-6">
                <h2 className="text-xl font-bold mb-4 text-gray-800">🎡 活動サマリー</h2>
                <div className="space-y-3">
                  <DataRow label="回転速度" value={latestData?.d2} trend={calculateTrend(data, 'd2')} />
                  <DataRow label="走行距離" value={latestData?.d1} />
                  <DataRow label="飲水累積" value={latestData?.d6} />
                  <DataRow label="MOT累積" value={latestData?.d7} />
                  <DataRow label="SIT累積" value={latestData?.d8} />
                </div>
              </div>
            </div>

            {/* グラフエリア */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
              {/* 温湿度グラフ */}
              <div className="bg-white rounded-lg shadow-lg p-6">
                <h2 className="text-xl font-bold mb-4 text-gray-800">📈 温度・湿度グラフ</h2>
                <ChartComponent
                  data={data}
                  datasets={[
                    { key: 'd3', label: '温度 (°C)', color: 'rgb(249, 115, 22)', yAxisID: 'y' },
                    { key: 'd4', label: '湿度 (%)', color: 'rgb(59, 130, 246)', yAxisID: 'y1' }
                  ]}
                  dual={true}
                />
              </div>

              {/* ROTグラフ */}
              <div className="bg-white rounded-lg shadow-lg p-6">
                <h2 className="text-xl font-bold mb-4 text-gray-800">📈 回転活動グラフ</h2>
                <ChartComponent
                  data={data}
                  datasets={[
                    { key: 'd1', label: '走行距離', color: 'rgb(220, 38, 38)', yAxisID: 'y' },
                    { key: 'd2', label: '回転速度', color: 'rgb(79, 70, 229)', yAxisID: 'y1' }
                  ]}
                  dual={true}
                />
              </div>

              {/* DRKグラフ */}
              <div className="bg-white rounded-lg shadow-lg p-6">
                <h2 className="text-xl font-bold mb-4 text-gray-800">📈 飲水累積グラフ</h2>
                <ChartComponent
                  data={data}
                  datasets={[
                    { key: 'd6', label: '飲水累積', color: 'rgb(6, 182, 212)', yAxisID: 'y' }
                  ]}
                  dual={false}
                />
              </div>

              {/* MOTグラフ */}
              <div className="bg-white rounded-lg shadow-lg p-6">
                <h2 className="text-xl font-bold mb-4 text-gray-800">📈 MOT (Motion) グラフ</h2>
                <ChartComponent
                  data={data}
                  datasets={[
                    { key: 'd7', label: 'MOT-ACUM', color: 'rgb(168, 85, 247)', yAxisID: 'y' }
                  ]}
                  dual={false}
                />
              </div>

              {/* SITグラフ */}
              <div className="bg-white rounded-lg shadow-lg p-6">
                <h2 className="text-xl font-bold mb-4 text-gray-800">📈 SIT (She is there) グラフ</h2>
                <ChartComponent
                  data={data}
                  datasets={[
                    { key: 'd8', label: 'KUSA-ACUM', color: 'rgb(132, 204, 22)', yAxisID: 'y' }
                  ]}
                  dual={false}
                />
              </div>

              {/* 体重グラフ */}
              <div className="bg-white rounded-lg shadow-lg p-6">
                <h2 className="text-xl font-bold mb-4 text-gray-800">📈 体重推移グラフ</h2>
                <HealthChartComponent healthRecords={healthRecords} />
              </div>
            </div>

            {/* データテーブル */}
            <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
              <h2 className="text-xl font-bold mb-4 text-gray-800">📊 最新データ（20件）</h2>
              <div className="overflow-x-auto">
                <table className="min-w-full divide-y divide-gray-200">
                  <thead className="bg-gray-50">
                    <tr>
                      <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">時刻</th>
                      <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">温度</th>
                      <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">湿度</th>
                      <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">回転速度</th>
                      <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">走行距離</th>
                      <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">飲水</th>
                      <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">MOT</th>
                      <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">SIT</th>
                    </tr>
                  </thead>
                  <tbody className="bg-white divide-y divide-gray-200">
                    {data.slice(-20).reverse().map((row, idx) => (
                      <tr key={idx} className="hover:bg-gray-50">
                        <td className="px-4 py-2 whitespace-nowrap text-sm text-gray-900">{row.time}</td>
                        <td className="px-4 py-2 whitespace-nowrap text-sm font-semibold text-orange-600">{row.d3}°C</td>
                        <td className="px-4 py-2 whitespace-nowrap text-sm font-semibold text-blue-600">{row.d4}%</td>
                        <td className="px-4 py-2 whitespace-nowrap text-sm text-gray-900">{row.d2}</td>
                        <td className="px-4 py-2 whitespace-nowrap text-sm text-gray-900">{row.d1}</td>
                        <td className="px-4 py-2 whitespace-nowrap text-sm text-gray-900">{row.d5}</td>
                        <td className="px-4 py-2 whitespace-nowrap text-sm text-gray-900">{row.d7}</td>
                        <td className="px-4 py-2 whitespace-nowrap text-sm text-gray-900">{row.d8}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            {/* 健康記録入力フォーム - ページ最下部に移動 */}
            <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
              <h2 className="text-xl font-bold mb-4 text-gray-800">📝 健康記録を追加</h2>
              <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">
                    日付
                  </label>
                  <input
                    type="date"
                    value={recordDate}
                    onChange={(e) => setRecordDate(e.target.value)}
                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                  />
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">
                    体重 (g)
                  </label>
                  <input
                    type="number"
                    value={weight}
                    onChange={(e) => setWeight(e.target.value)}
                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                    placeholder="250"
                  />
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">
                    糞の状態
                  </label>
                  <select
                    value={fecesCondition}
                    onChange={(e) => setFecesCondition(e.target.value)}
                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                  >
                    <option value="">選択してください</option>
                    <option value="normal">正常</option>
                    <option value="soft">軟便</option>
                    <option value="hard">硬い</option>
                    <option value="diarrhea">下痢</option>
                  </select>
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">
                    メモ
                  </label>
                  <input
                    type="text"
                    value={memo}
                    onChange={(e) => setMemo(e.target.value)}
                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                    placeholder="気づいたことなど"
                  />
                </div>

                <div className="flex items-end">
                  <button
                    onClick={saveHealthRecord}
                    className="w-full px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors"
                  >
                    💾 保存
                  </button>
                </div>
              </div>

              {/* 健康記録テーブル */}
              {healthRecords.length > 0 && (
                <div className="mt-6">
                  <h3 className="text-lg font-bold mb-3 text-gray-800">📊 記録履歴（最新10件）</h3>
                  <div className="overflow-x-auto">
                    <table className="min-w-full divide-y divide-gray-200">
                      <thead className="bg-gray-50">
                        <tr>
                          <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">日付</th>
                          <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">体重 (g)</th>
                          <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">糞の状態</th>
                          <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">メモ</th>
                        </tr>
                      </thead>
                      <tbody className="bg-white divide-y divide-gray-200">
                        {healthRecords.slice(-10).reverse().map((record, idx) => (
                          <tr key={idx} className="hover:bg-gray-50">
                            <td className="px-4 py-2 whitespace-nowrap text-sm text-gray-900">
                              {new Date(record.date).toLocaleDateString('ja-JP')}
                            </td>
                            <td className="px-4 py-2 whitespace-nowrap text-sm font-semibold text-green-600">
                              {record.weight}g
                            </td>
                            <td className="px-4 py-2 whitespace-nowrap text-sm text-gray-900">
                              {record.fecesCondition}
                            </td>
                            <td className="px-4 py-2 text-sm text-gray-900">
                              {record.memo}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </div>

            <div className="text-center mt-8 pb-4">
              <p className="text-sm text-gray-600">
                🔄 自動更新: 3分毎 | データ件数: {data.length}件 | 健康記録: {healthRecords.length}件
              </p>
            </div>
          </div>
        </div>
      );
    }

    // Chart.jsコンポーネント
    function ChartComponent({ data, datasets, dual }) {
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      useEffect(() => {
        if (!chartRef.current || !data || data.length === 0) return;

        if (chartInstance.current) {
          chartInstance.current.destroy();
        }

        const ctx = chartRef.current.getContext('2d');

        const chartDatasets = datasets.map(ds => ({
          label: ds.label,
          data: data.map(item => item[ds.key]),
          borderColor: ds.color,
          backgroundColor: ds.color.replace('rgb', 'rgba').replace(')', ', 0.1)'),
          tension: 0.4,
          yAxisID: ds.yAxisID
        }));

        const scales = {
          x: {
            display: true,
            ticks: {
              maxRotation: 45,
              minRotation: 45
            }
          },
          y: {
            type: 'linear',
            display: true,
            position: 'left'
          }
        };

        if (dual) {
          scales.y1 = {
            type: 'linear',
            display: true,
            position: 'right',
            grid: {
              drawOnChartArea: false
            }
          };
        }

        chartInstance.current = new Chart(ctx, {
          type: 'line',
          data: {
            labels: data.map(item => item.timeOnly),
            datasets: chartDatasets
          },
          options: {
            responsive: true,
            maintainAspectRatio: true,
            aspectRatio: 2,
            interaction: {
              mode: 'index',
              intersect: false
            },
            plugins: {
              legend: {
                display: true,
                position: 'top'
              },
              tooltip: {
                callbacks: {
                  title: function (context) {
                    return data[context[0].dataIndex].time;
                  }
                }
              }
            },
            scales: scales
          }
        });

        return () => {
          if (chartInstance.current) {
            chartInstance.current.destroy();
          }
        };
      }, [data, datasets, dual]);

      return <canvas ref={chartRef}></canvas>;
    }

    // 健康記録グラフコンポーネント
    function HealthChartComponent({ healthRecords }) {
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      useEffect(() => {
        if (!chartRef.current || !healthRecords || healthRecords.length === 0) return;

        if (chartInstance.current) {
          chartInstance.current.destroy();
        }

        const ctx = chartRef.current.getContext('2d');

        // 日付でソート
        const sortedRecords = [...healthRecords].sort((a, b) =>
          new Date(a.date) - new Date(b.date)
        );

        chartInstance.current = new Chart(ctx, {
          type: 'line',
          data: {
            labels: sortedRecords.map(record =>
              new Date(record.date).toLocaleDateString('ja-JP', { month: '2-digit', day: '2-digit' })
            ),
            datasets: [{
              label: '体重 (g)',
              data: sortedRecords.map(record => record.weight),
              borderColor: 'rgb(34, 197, 94)',
              backgroundColor: 'rgba(34, 197, 94, 0.1)',
              tension: 0.4
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: true,
            aspectRatio: 2,
            interaction: {
              mode: 'index',
              intersect: false
            },
            plugins: {
              legend: {
                display: true,
                position: 'top'
              },
              tooltip: {
                callbacks: {
                  afterLabel: function (context) {
                    const record = sortedRecords[context.dataIndex];
                    return [
                      `糞: ${record.fecesCondition}`,
                      record.memo ? `メモ: ${record.memo}` : ''
                    ].filter(Boolean);
                  }
                }
              }
            },
            scales: {
              y: {
                type: 'linear',
                display: true,
                position: 'left'
              }
            }
          }
        });

        return () => {
          if (chartInstance.current) {
            chartInstance.current.destroy();
          }
        };
      }, [healthRecords]);

      if (!healthRecords || healthRecords.length === 0) {
        return (
          <div className="flex items-center justify-center h-48 text-gray-400">
            データがありません。記録を追加してください。
          </div>
        );
      }

      return <canvas ref={chartRef}></canvas>;
    }

    // 状態占有時間の円グラフコンポーネント
    function StateOccupancyPieChart({ stateOccupancy }) {
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      useEffect(() => {
        if (!chartRef.current || !stateOccupancy) return;

        if (chartInstance.current) {
          chartInstance.current.destroy();
        }

        const ctx = chartRef.current.getContext('2d');

        const labels = ['🏃 走行中', '🍽️ 食事中', '💧 飲水中', '🐹 活動中', '😴 休息中'];
        const dataValues = [
          stateOccupancy['走行中'],
          stateOccupancy['食事中'],
          stateOccupancy['飲水中'],
          stateOccupancy['活動中'],
          stateOccupancy['休息中']
        ];
        const colors = [
          'rgb(168, 85, 247)',   // 走行中 - purple
          'rgb(249, 115, 22)',   // 食事中 - orange
          'rgb(6, 182, 212)',    // 飲水中 - cyan
          'rgb(34, 197, 94)',    // 活動中 - green
          'rgb(107, 114, 128)'   // 休息中 - gray
        ];

        chartInstance.current = new Chart(ctx, {
          type: 'pie',
          data: {
            labels: labels,
            datasets: [{
              data: dataValues,
              backgroundColor: colors,
              borderColor: 'white',
              borderWidth: 2
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: true,
            aspectRatio: 1.5,
            plugins: {
              legend: {
                display: true,
                position: 'bottom'
              },
              tooltip: {
                callbacks: {
                  label: function (context) {
                    const minutes = context.parsed;
                    const hours = Math.floor(minutes / 60);
                    const mins = Math.round(minutes % 60);
                    const total = dataValues.reduce((a, b) => a + b, 0);
                    const percentage = ((minutes / total) * 100).toFixed(1);
                    return `${context.label}: ${hours}時間${mins}分 (${percentage}%)`;
                  }
                }
              }
            }
          }
        });

        return () => {
          if (chartInstance.current) {
            chartInstance.current.destroy();
          }
        };
      }, [stateOccupancy]);

      return <canvas ref={chartRef}></canvas>;
    }

    // 状態占有時間の詳細表示コンポーネント
    function StateOccupancyDetail({ label, minutes, color, totalMinutes }) {
      const hours = Math.floor(minutes / 60);
      const mins = Math.round(minutes % 60);
      const percentage = totalMinutes > 0 ? ((minutes / totalMinutes) * 100).toFixed(1) : '0.0';

      return (
        <div className="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
          <span className="text-sm font-medium text-gray-700">{label}</span>
          <div className="flex items-center gap-3">
            <span className={`text-lg font-bold ${color}`}>
              {hours > 0 ? `${hours}時間${mins}分` : `${mins}分`}
            </span>
            <span className="text-sm font-semibold text-gray-600 min-w-[3.5rem] text-right">
              ({percentage}%)
            </span>
          </div>
        </div>
      );
    }

    function DataRow({ label, value, trend }) {
      return (
        <div className="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
          <span className="text-sm font-medium text-gray-700">{label}</span>
          <div className="flex items-center gap-2">
            <span className="text-lg font-bold text-gray-900">{value}</span>
            {trend && (
              <span className={`text-sm ${trend > 0 ? 'text-red-500' : 'text-blue-500'}`}>
                {trend > 0 ? '↑' : '↓'}
              </span>
            )}
          </div>
        </div>
      );
    }

    function calculateAverage(data, key) {
      if (!data || data.length === 0) return '---';
      const sum = data.reduce((acc, item) => acc + (parseFloat(item[key]) || 0), 0);
      return (sum / data.length).toFixed(1);
    }

    function calculateTrend(data, key) {
      if (!data || data.length < 10) return null;
      const recent = data.slice(-5);
      const previous = data.slice(-10, -5);
      const recentAvg = recent.reduce((acc, item) => acc + (parseFloat(item[key]) || 0), 0) / 5;
      const previousAvg = previous.reduce((acc, item) => acc + (parseFloat(item[key]) || 0), 0) / 5;
      return recentAvg - previousAvg;
    }

    ReactDOM.render(<DeguMonitoringDashboard />, document.getElementById('root'));
  </script>
</body>
