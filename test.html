<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Babel動作テスト（バージョン固定版）</title>
  <!-- すべてバージョンを明示的に固定（@x.y.z）。これにより、線の向こうの実体が勝手に入れ替わらない -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <!-- data-type="script" を明示し、新Babelに「これはモジュールではなく素のスクリプトだ」と伝える保険 -->
  <script type="text/babel" data-type="script">
    function Test() {
      return <h1 style={{ fontFamily: 'sans-serif', color: '#4f46e5' }}>✅ Babel は動いている（バージョン固定版）</h1>;
    }
    ReactDOM.render(<Test />, document.getElementById('root'));
  </script>
</body>
</html>
